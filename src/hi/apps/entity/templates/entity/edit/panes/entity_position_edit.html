  {% csrf_token %}
  {% if entity_instance_id %}
  <input type="hidden" name="entity_instance_id" value="{{ entity_instance_id }}">

  {% include "location/edit/panes/location_item_position_form.html" with location_item_position_form=entity_position_form %}
</form>
